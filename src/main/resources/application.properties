spring.application.name=barbup-api
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.security.token.secret=${JWT_SECRET}
resend.api-key=${RENDER_API_KEY}

mailjet.api-key=${MAILJET_API_KEY}
mailjet.api-secret=${MAILJET_API_SECRET}
mailjet.sender-email=${MAILJET_SENDER_EMAIL}
mailjet.sender-name=BarbUp

app.email.provider=${EMAIL_PROVIDER:mailjet}